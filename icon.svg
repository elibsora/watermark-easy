<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#grad)" filter="url(#shadow)"/>

  <!-- Water Drop / Stamp symbol -->
  <path d="M256 100 C256 100, 140 250, 140 330 A116 116 0 0 0 372 330 C372 250, 256 100, 256 100 Z" fill="#ffffff" fill-opacity="0.95"/>
  
  <!-- Inner Highlight droplet -->
  <path d="M230 200 C230 200, 180 270, 180 310 A60 60 0 0 0 250 365 C230 355, 210 330, 210 300 C210 260, 230 200, 230 200 Z" fill="#bfdbfe" fill-opacity="0.8"/>

  <!-- Copyright stamp symbol inside -->
  <circle cx="280" cy="330" r="34" fill="#2563eb" fill-opacity="0.9"/>
  <text x="280" y="342" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">©</text>
</svg>
